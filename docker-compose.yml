services:
  redis:
    image: redis:7-alpine
    container_name: api-gateway-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: api-gateway-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gateway_user
      POSTGRES_PASSWORD: gateway_password
      POSTGRES_DB: gateway_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway_user -d gateway_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # app:
  #   build: .
  #   container_name: api-security-gateway
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   environment:
  #     REDIS_HOST: redis
  #     DATABASE_URL: "postgresql://gateway_user:gateway_password@postgres:5432/gateway_db?schema=public"
  #   depends_on:
  #     redis:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy

  
  app1:
    build: .
    container_name: api-gateway-app1
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      DATABASE_URL: "postgresql://gateway_user:gateway_password@postgres:5432/gateway_db?schema=public"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  app2:
    build: .
    container_name: api-gateway-app2
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      DATABASE_URL: "postgresql://gateway_user:gateway_password@postgres:5432/gateway_db?schema=public"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s


  
  nginx:
    image: nginx:1.28-alpine
    container_name: api-gateway-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # depends_on:
    #   - app
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
