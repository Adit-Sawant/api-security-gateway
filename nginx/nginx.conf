
events {
    worker_connections 1024;
}

http {
    # Basic connection settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Hide NGINX version
    server_tokens off;

    log_format upstreamlog
    '$remote_addr "$request" '
    'status=$status upstream=$upstream_addr';
    access_log /dev/stdout upstreamlog;

    # Request body size restriction
    client_max_body_size 5m;

    # Timeouts
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    # Backend connection
    upstream nestjs_backend {
    least_conn;

    server app1:3000 max_fails=3 fail_timeout=10s;
    server app2:3000 max_fails=3 fail_timeout=10s;

    keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check
        location /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "NGINX is healthy\n";
        }

        # Reverse proxy
        location / {
            proxy_pass http://nestjs_backend;

            # HTTP version and connection reuse
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Backend timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
